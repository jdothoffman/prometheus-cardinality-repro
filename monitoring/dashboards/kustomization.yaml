# Packages the dashboard JSON as a ConfigMap that the Grafana sidecar auto-loads.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring
generatorOptions:
  disableNameSuffixHash: true
  labels:
    grafana_dashboard: "1"
configMapGenerator:
  - name: grafana-dashboard-cardinality
    files:
      - cardinality.json
  - name: grafana-dashboard-deep-dive
    files:
      - deep-dive.json
  - name: grafana-dashboard-traces
    files:
      - traces.json
  - name: grafana-dashboard-overview
    files:
      - overview.json
