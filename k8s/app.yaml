apiVersion: v1
kind: Namespace
metadata:
  name: demo
---
# 4 real replicas x VIRTUAL_PODS=50 simulated pod names = ~200 "pods" in the pod label.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: transactions-api
  namespace: demo
  labels: { app: transactions-api }
spec:
  replicas: 4
  selector:
    matchLabels: { app: transactions-api }
  template:
    metadata:
      labels: { app: transactions-api }
    spec:
      nodeSelector:
        pool: app
      containers:
        - name: app
          image: transactions-api:local
          imagePullPolicy: Never # loaded with `k3d image import`
          ports:
            - { name: http, containerPort: 8080 }
          env:
            - name: POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            - { name: CARDINALITY_MODE, value: bounded }
            - { name: VIRTUAL_PODS, value: "50" }
            - { name: POD_CHURN_SECONDS, value: "0" }
            - { name: OTEL_CARDINALITY_LIMIT, value: "200000" }
            # OTel SDK -> Alloy: push OTLP every 10s from a background thread.
            - { name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "http://alloy.alloy.svc.cluster.local:4318" }
            - { name: OTEL_EXPORTER_OTLP_PROTOCOL, value: http/protobuf }
            - { name: OTEL_METRIC_EXPORT_INTERVAL, value: "10000" }
            - { name: OTEL_METRIC_EXPORT_TIMEOUT, value: "8000" }
            - { name: DOTNET_gcServer, value: "0" }
            - { name: Logging__LogLevel__Microsoft.AspNetCore, value: Warning }
          resources:
            requests: { cpu: 100m, memory: 192Mi }
            limits: { memory: 768Mi }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
            failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: transactions-api
  namespace: demo
  labels: { app: transactions-api }
spec:
  selector: { app: transactions-api }
  ports:
    - { name: http, port: 8080, targetPort: http }
