apiVersion: v1
kind: Namespace
metadata:
  name: demo
---
# 4 real replicas x VIRTUAL_PODS=50 simulated pod names = ~200 "pods" in the pod label.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: transactions-api
  namespace: demo
  labels: { app: transactions-api }
spec:
  replicas: 4
  selector:
    matchLabels: { app: transactions-api }
  template:
    metadata:
      labels: { app: transactions-api }
    spec:
      nodeSelector:
        pool: app
      containers:
        - name: app
          image: transactions-api:local
          imagePullPolicy: Never # loaded with `k3d image import`
          ports:
            - { name: http, containerPort: 8080 }
          env:
            - name: POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            - { name: APP_ROLE, value: api }
            - { name: CARDINALITY_MODE, value: bounded }
            - { name: CPU_WORK_ITERATIONS, value: "50" }
            - { name: VIRTUAL_PODS, value: "50" }
            - { name: POD_CHURN_SECONDS, value: "0" }
            - { name: OTEL_CARDINALITY_LIMIT, value: "200000" }
            # OTel SDK -> Alloy: push OTLP every 10s from a background thread.
            - { name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "http://alloy.alloy.svc.cluster.local:4318" }
            - { name: OTEL_EXPORTER_OTLP_PROTOCOL, value: http/protobuf }
            - { name: OTEL_METRIC_EXPORT_INTERVAL, value: "10000" }
            - { name: OTEL_METRIC_EXPORT_TIMEOUT, value: "8000" }
            - { name: DOTNET_gcServer, value: "0" }
            - { name: Logging__LogLevel__Microsoft.AspNetCore, value: Warning }
          # A CPU limit, as in production: when the pod needs more, it is throttled and requests queue.
          resources:
            requests: { cpu: 250m, memory: 192Mi }
            limits: { cpu: "1", memory: 768Mi }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
            failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: transactions-api
  namespace: demo
  labels: { app: transactions-api }
spec:
  selector: { app: transactions-api }
  ports:
    - { name: http, port: 8080, targetPort: http }
---
# Headless Service: lets the driver reach every replica directly (stats + label mode), including
# replicas that are restarting (publishNotReadyAddresses).
apiVersion: v1
kind: Service
metadata:
  name: transactions-api-headless
  namespace: demo
  labels: { app: transactions-api }
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector: { app: transactions-api }
  ports:
    - { name: http, port: 8080, targetPort: http }
---
# The driver reads pods, pod logs and events (read-only) to put termination reasons, warning events
# and crashed-container log excerpts into each run's report.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: transactions-driver
  namespace: demo
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: transactions-driver-evidence
rules:
  - apiGroups: [""]
    resources: [pods, pods/log, events]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: transactions-driver-evidence
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: transactions-driver-evidence
subjects:
  - kind: ServiceAccount
    name: transactions-driver
    namespace: demo
---
# Run records and HTML reports survive driver restarts.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: transactions-driver-data
  namespace: demo
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests: { storage: 1Gi }
---
# Load-test console (same image, APP_ROLE=driver). Runs on the control-plane node so generating load
# doesn't compete for CPU with the replicas under test on the app pool.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: transactions-driver
  namespace: demo
  labels: { app: transactions-driver }
spec:
  replicas: 1
  strategy: { type: Recreate } # one writer for the data volume
  selector:
    matchLabels: { app: transactions-driver }
  template:
    metadata:
      labels: { app: transactions-driver }
    spec:
      serviceAccountName: transactions-driver
      nodeSelector:
        node-role.kubernetes.io/control-plane: "true"
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: transactions-driver-data }
      containers:
        - name: driver
          image: transactions-api:local
          imagePullPolicy: Never
          ports:
            - { name: http, containerPort: 8080 }
          env:
            - { name: APP_ROLE, value: driver }
            - { name: DATA_DIR, value: /data }
            - { name: TARGET_URL, value: "http://transactions-api.demo.svc.cluster.local:8080" }
            - { name: REPLICA_DNS, value: "transactions-api-headless.demo.svc.cluster.local" }
            - { name: PROMETHEUS_URL, value: "http://kps-prometheus.monitoring.svc:9090" }
            # Dry-run check that the Grafana dashboard is provisioned (local-only default credentials).
            - { name: GRAFANA_URL, value: "http://kps-grafana.monitoring.svc" }
            - { name: GRAFANA_USER, value: admin }
            - { name: GRAFANA_PASSWORD, value: admin }
            - { name: Logging__LogLevel__Microsoft.AspNetCore, value: Warning }
            - { name: Logging__LogLevel__System.Net.Http.HttpClient, value: Warning }
          volumeMounts:
            - { name: data, mountPath: /data }
          resources:
            requests: { cpu: 500m, memory: 128Mi }
            limits: { memory: 768Mi }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: transactions-driver
  namespace: demo
  labels: { app: transactions-driver }
spec:
  selector: { app: transactions-driver }
  ports:
    - { name: http, port: 8080, targetPort: http }
